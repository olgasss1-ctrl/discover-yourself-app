<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Discover Yourself</title>

  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#0b1220">

  <style>
    :root{
      --bg:#fbf7ff;
      --card:#ffffff;
      --ink:#1b1530;
      --muted:#6b5d86;

      --violet:#cdb7ff;        /* світло-фіолетовий */
      --violet-2:#efe8ff;      /* дуже світлий */
      --violet-deep:#4b2a86;   /* темно-фіолетовий (акценти) */
      --violet-deep-2:#2b1458; /* ще глибше */

      --gold:#d6b25a;
      --gold-2:#f3e7c6;

      --danger:#c43d4b;
      --ok:#2e7d32;

      --shadow: 0 10px 30px rgba(20,10,40,.10);
      --radius:18px;
    }

    *{box-sizing:border-box}
    body{
      margin:0;
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, "Noto Sans", "Apple Color Emoji","Segoe UI Emoji";
      color:var(--ink);
      background:
        radial-gradient(1200px 600px at 20% -10%, rgba(205,183,255,.45), transparent 60%),
        radial-gradient(900px 500px at 100% 0%, rgba(214,178,90,.22), transparent 55%),
        var(--bg);
      min-height:100vh;
    }

    header{
      padding:18px 16px 8px;
      max-width:980px;
      margin:0 auto;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
    }

    .brand{
      display:flex;
      align-items:center;
      gap:10px;
      user-select:none;
    }
    .logoImg{
      width:38px;
      height:38px;
      border-radius:12px;
      object-fit:cover;
      display:block;
      border:1px solid rgba(214,178,90,.45);
      box-shadow: 0 8px 18px rgba(20,10,40,.10);
      background: linear-gradient(135deg, rgba(205,183,255,.95), rgba(214,178,90,.35));
    }
    .brand h1{
      font-size:18px;
      margin:0;
      letter-spacing:.2px;
    }
    .brand small{
      color:var(--muted);
      display:block;
      margin-top:2px;
      font-size:12px;
    }

    .wrap{
      max-width:980px;
      margin:0 auto;
      padding:10px 16px 40px;
    }

    .tabs{
      display:flex;
      gap:10px;
      flex-wrap:wrap;
      margin:12px 0 14px;
    }

    .tab{
      border:1px solid rgba(27,21,48,.12);
      background: rgba(255,255,255,.55);
      padding:10px 12px;
      border-radius:999px;
      cursor:pointer;
      color:var(--muted);
      transition:.15s ease;
      display:flex;align-items:center;gap:8px;
      box-shadow: 0 6px 16px rgba(20,10,40,.05);
    }
    .tab.active{
      color:var(--ink);
      background: linear-gradient(180deg, rgba(205,183,255,.35), rgba(255,255,255,.9));
      border-color: rgba(214,178,90,.45);
      box-shadow: 0 10px 22px rgba(20,10,40,.09);
    }

    .card{
      background: rgba(255,255,255,.85);
      border:1px solid rgba(27,21,48,.10);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding:16px;
    }

    .row{
      display:flex;
      gap:14px;
      flex-wrap:wrap;
      align-items:stretch;
    }
    .col{flex:1 1 320px}

    .title{
      margin:0 0 6px;
      font-size:18px;
      letter-spacing:.2px;
    }
    .hint{color:var(--muted); margin:0 0 10px; line-height:1.45}

    /* Question card — зробили помітнішим */
    .q{
      margin:14px 0;
      padding:14px;
      border-radius:18px;
      background:
        radial-gradient(380px 140px at 12% 0%, rgba(205,183,255,.55), rgba(255,255,255,0) 70%),
        linear-gradient(180deg, rgba(239,232,255,.92), rgba(255,255,255,.92));
      border: 2px solid rgba(75,42,134,.18);
      box-shadow: 0 12px 26px rgba(20,10,40,.08);
      position:relative;
    }
    .q::before{
      content:"";
      position:absolute;
      left:10px;
      top:12px;
      bottom:12px;
      width:4px;
      border-radius:999px;
      background: linear-gradient(180deg, rgba(75,42,134,.95), rgba(205,183,255,.55));
      opacity:.85;
    }

    .q h3{
      margin:0 0 10px;
      font-size:15px;
      line-height:1.35;
      padding-left:10px;
    }

    .opts{
      display:grid;
      gap:10px;
      margin-top:10px;
    }

    .opt{
      display:flex;
      gap:12px;
      align-items:flex-start;
      padding:12px 12px;
      border-radius:16px;
      border:1px solid rgba(205,183,255,.45);
      background:
        linear-gradient(180deg, rgba(255,255,255,.92), rgba(239,232,255,.65));
      cursor:pointer;
      transition:.14s ease;
      position:relative;
    }

    .opt:hover{
      border-color: rgba(214,178,90,.65);
      box-shadow: 0 14px 22px rgba(20,10,40,.08);
      transform: translateY(-1px);
    }

    /* Виділення вибору — темно-фіолетове, добре помітне */
    .opt.selected{
      border-color: rgba(75,42,134,.85);
      background:
        radial-gradient(260px 80px at 15% 0%, rgba(255,255,255,.95), rgba(255,255,255,0) 70%),
        linear-gradient(180deg, rgba(75,42,134,.18), rgba(255,255,255,.92));
      box-shadow: 0 18px 30px rgba(20,10,40,.12);
    }
    .opt.selected::after{
      content:"✓";
      position:absolute;
      right:12px;
      top:12px;
      width:28px;
      height:28px;
      border-radius:10px;
      display:grid;
      place-items:center;
      font-weight:900;
      color:#fff;
      background: linear-gradient(180deg, rgba(75,42,134,.98), rgba(43,20,88,.92));
      box-shadow: 0 10px 18px rgba(20,10,40,.18);
    }

    .badge{
      min-width:34px;
      height:34px;
      border-radius:12px;
      display:grid;
      place-items:center;
      font-weight:900;
      letter-spacing:.5px;

      background:
        radial-gradient(16px 16px at 30% 25%, rgba(255,255,255,.95), rgba(255,255,255,0) 60%),
        linear-gradient(135deg, rgba(205,183,255,.85), rgba(214,178,90,.28));

      border:1px solid rgba(214,178,90,.55);
      box-shadow:
        0 10px 18px rgba(20,10,40,.10),
        0 0 0 2px rgba(205,183,255,.18);

      color:#23143f;
      flex:0 0 auto;
    }

    .actions{
      display:flex;
      gap:10px;
      flex-wrap:wrap;
      margin-top:12px;
    }

    button{
      border:0;
      padding:12px 14px;
      border-radius:14px;
      cursor:pointer;
      font-weight:700;
      letter-spacing:.2px;
      transition:.12s ease;
    }
    .btnPrimary{
      background: linear-gradient(135deg, rgba(205,183,255,.95), rgba(214,178,90,.35));
      color:#20123a;
      border:1px solid rgba(214,178,90,.55);
      box-shadow: 0 12px 22px rgba(20,10,40,.10);
    }
    .btnPrimary:hover{ transform: translateY(-1px); }
    .btnGhost{
      background: rgba(255,255,255,.65);
      border:1px solid rgba(27,21,48,.16);
      color: var(--muted);
    }
    .btnDanger{
      background: rgba(196,61,75,.10);
      border:1px solid rgba(196,61,75,.30);
      color: var(--danger);
    }

    .pill{
      display:inline-flex;
      align-items:center;
      gap:8px;
      padding:8px 10px;
      border-radius:999px;
      background: rgba(239,232,255,.9);
      border:1px solid rgba(205,183,255,.5);
      color:var(--muted);
      font-size:12px;
    }

    .resultBox{
      padding:14px;
      border-radius:16px;
      border:1px solid rgba(214,178,90,.45);
      background: linear-gradient(180deg, rgba(255,255,255,.90), rgba(239,232,255,.85));
    }

    .resTitle{
      margin:0 0 6px;
      font-size:18px;
    }

    .resText{
      margin:0;
      line-height:1.58;
      color: #2a2145;
    }

    .grid2{
      display:grid;
      grid-template-columns: 1fr;
      gap:12px;
    }
    @media (min-width: 860px){
      .grid2{ grid-template-columns: 1fr 1fr; }
    }

    .label{
      font-weight:700;
      margin:10px 0 6px;
    }

    input[type="range"]{ width:100% }
    input[type="text"], textarea{
      width:100%;
      padding:12px 12px;
      border-radius:14px;
      border:1px solid rgba(27,21,48,.16);
      outline:none;
      background: rgba(255,255,255,.85);
      font-family: inherit;
      color: var(--ink);
    }
    textarea{ min-height: 110px; resize: vertical; }

    .mini{
      font-size:12px;color:var(--muted);
    }

    canvas{
      width:100%;
      height:180px;
      background: rgba(255,255,255,.65);
      border: 1px solid rgba(27,21,48,.12);
      border-radius: 16px;
    }

    .list{
      margin:0;
      padding:0;
      list-style:none;
      display:grid;
      gap:10px;
    }
    .item{
      padding:12px;
      border-radius:16px;
      border:1px solid rgba(27,21,48,.12);
      background: rgba(255,255,255,.70);
    }

    .kbd{
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      padding: 2px 7px;
      border-radius: 8px;
      border:1px solid rgba(27,21,48,.18);
      background: rgba(255,255,255,.75);
      color: var(--muted);
      font-size:12px;
    }

    /* Номер питання — яскравіший + темно-фіолетовий обідок */
    .qnum{
      display:inline-flex;
      align-items:center;
      justify-content:center;
      min-width:42px;
      height:42px;
      padding:0 14px;
      border-radius:999px;

      font-weight:900;
      font-size:15px;

      color:#fff;

      background:
        radial-gradient(18px 18px at 30% 30%, rgba(255,255,255,.30), rgba(255,255,255,0) 60%),
        linear-gradient(180deg, rgba(75,42,134,.98), rgba(43,20,88,.92));

      border:2px solid rgba(205,183,255,.75);
      box-shadow: 0 10px 22px rgba(40,18,80,.16);
      margin-right:10px;
    }

    .splitHeader{
      display:flex;
      align-items:flex-end;
      justify-content:space-between;
      gap:12px;
      flex-wrap:wrap;
    }

    .mutedLine{
      color:var(--muted);
      font-size:13px;
      line-height:1.45;
      margin:0;
    }

    .sectionTag{
      display:inline-flex;
      gap:8px;
      align-items:center;
      padding:7px 10px;
      border-radius:999px;
      background: rgba(75,42,134,.08);
      border:1px solid rgba(75,42,134,.16);
      color: rgba(75,42,134,.92);
      font-weight:800;
      font-size:12px;
    }

    .divider{
      height:1px;
      background: rgba(27,21,48,.10);
      margin:12px 0;
    }
  </style>
</head>

<body>
<header>
  <div class="brand">
    <img class="logoImg" src="icon.svg?v=3" alt="Discover Yourself">
    <div>
      <h1>Discover Yourself</h1>
      <small>тест стратегій + щоденний check-in (7 днів)</small>
    </div>
  </div>
  <div class="pill" id="statusPill">Готово ✅</div>
</header>

<div class="wrap">
  <div class="tabs">
    <div class="tab active" data-tab="test">Тест</div>
    <div class="tab" data-tab="result">Результат</div>
    <div class="tab" data-tab="daily">Щодня</div>
    <div class="tab" data-tab="dynamics">Динаміка 7 днів</div>
  </div>

  <div id="viewTest" class="card"></div>
  <div id="viewResult" class="card" style="display:none"></div>
  <div id="viewDaily" class="card" style="display:none"></div>
  <div id="viewDynamics" class="card" style="display:none"></div>
</div>

<script>
/** =========================
 *  STRATEGIES (8)
 *  ========================= */
const STRATEGIES = [
  {
    key:"contact",
    name:"Контакт — тривога близькості",
    wow: `
      <p class="mutedLine">
        Коли контакт стає невизначеним (пауза, холодніша відповідь, “не так подивились”), у тілі швидко піднімається напруга:
        <b>«а раптом я щось зіпсувала?»</b> або <b>«а раптом мене відсунули?»</b>.
        Це не “слабкість”, а спосіб нервової системи повернути відчуття зв’язку й безпеки.
      </p>
      <div class="divider"></div>
      <p class="mutedLine">
        <b>Як проявляється:</b> хочеться уточнити, написати ще раз, “закрити паузу”; після розмови думки крутяться довкола деталей
        (тон, слова, час відповіді). Важливий сигнал — внутрішня залежність від реакції іншого.
      </p>
      <div class="divider"></div>
      <p class="mutedLine"><b>Питання до себе:</b></p>
      <ul class="mutedLine" style="margin:6px 0 0 18px">
        <li>Я зараз тягнуся до людини з близькості чи з тривоги?</li>
        <li>Що я точно знаю (факт), а що домислюю?</li>
        <li>Яку потребу я намагаюся закрити — безпеку, увагу, підтвердження?</li>
      </ul>
      <div class="divider"></div>
      <p class="mutedLine"><b>Практичні кроки:</b></p>
      <ul class="mutedLine" style="margin:6px 0 0 18px">
        <li>Пауза 10–20 хв перед “ще одним повідомленням”.</li>
        <li>Одна ясна фраза замість серії уточнень: «Мені важливо уточнити…»</li>
        <li>Повернути фокус у себе: “що мені зараз потрібно?”</li>
      </ul>
    `
  },
  {
    key:"control",
    name:"Контроль — опора через структуру",
    wow: `
      <p class="mutedLine">
        У напрузі мозок шукає кермо. Контроль — це спосіб повернути передбачуваність: план, правила, ясні домовленості.
        Це може бути дуже ресурсно, поки не перетворюється на внутрішній наказ: <b>«я маю все тримати»</b>.
      </p>
      <div class="divider"></div>
      <p class="mutedLine">
        <b>Як проявляється:</b> “дотиснути” ясність, зібрати факти, зробити план, зафіксувати рішення.
        У стосунках — бажання “розкласти все по поличках”. На роботі — взяти відповідальність за все.
      </p>
      <div class="divider"></div>
      <p class="mutedLine"><b>Питання до себе:</b></p>
      <ul class="mutedLine" style="margin:6px 0 0 18px">
        <li>Я зараз справді керую чи просто тривожусь?</li>
        <li>Що залежить від мене, а що ні?</li>
        <li>Який один крок достатній сьогодні?</li>
      </ul>
      <div class="divider"></div>
      <p class="mutedLine"><b>Практичні кроки:</b></p>
      <ul class="mutedLine" style="margin:6px 0 0 18px">
        <li>Розділити: “можу вплинути / не можу”.</li>
        <li>Замість великого плану — 1 дія на 30 хв.</li>
        <li>Дозволити одну незакриту деталь до завтра.</li>
      </ul>
    `
  },
  {
    key:"analysis",
    name:"Аналіз — вийти в голову, щоб витримати",
    wow: `
      <p class="mutedLine">
        Аналіз — це спосіб пережити емоцію через думку. Коли боляче або страшно, включається логіка, пояснення, “розбір”.
        Це допомагає не зламатися, але інколи відриває від живого відчуття.
      </p>
      <div class="divider"></div>
      <p class="mutedLine">
        <b>Як проявляється:</b> прокручування сценаріїв, пошук причин, спроба знайти “правильне пояснення”.
        У конфлікті — розумні аргументи замість визнання: «мені неприємно / я злюся».
      </p>
      <div class="divider"></div>
      <p class="mutedLine"><b>Питання до себе:</b></p>
      <ul class="mutedLine" style="margin:6px 0 0 18px">
        <li>Що я зараз відчуваю (1 слово), якщо прибрати пояснення?</li>
        <li>Це факт чи інтерпретація?</li>
        <li>Який контакт із реальністю мені потрібен (питання, уточнення, підтримка)?</li>
      </ul>
      <div class="divider"></div>
      <p class="mutedLine"><b>Практичні кроки:</b></p>
      <ul class="mutedLine" style="margin:6px 0 0 18px">
        <li>Назвати одну емоцію вголос/у нотатці.</li>
        <li>Факт vs інтерпретація (2 рядки).</li>
        <li>Один прямий запит замість 10 здогадів.</li>
      </ul>
    `
  },
  {
    key:"distance",
    name:"Дистанція — зберегти себе, відступивши",
    wow: `
      <p class="mutedLine">
        Дистанція вмикається, коли є ризик болю: холод, несправедливість, відчуття, що вас “не чують”.
        Це спосіб не руйнуватися — відійти, охолонути, відновити межі.
      </p>
      <div class="divider"></div>
      <p class="mutedLine">
        <b>Як проявляється:</b> зменшення контакту, стриманість, автономність. Інколи — різкість або “відсікання”.
        Важлива різниця: дистанція може бути здоровою паузою, а може стати втечею від розмови.
      </p>
      <div class="divider"></div>
      <p class="mutedLine"><b>Питання до себе:</b></p>
      <ul class="mutedLine" style="margin:6px 0 0 18px">
        <li>Я відступаю, щоб відновитися чи щоб уникнути ясності?</li>
        <li>Яку одну фразу я можу сказати без пояснень і доказів?</li>
        <li>Чого я насправді хочу: межі чи зв’язку?</li>
      </ul>
      <div class="divider"></div>
      <p class="mutedLine"><b>Практичні кроки:</b></p>
      <ul class="mutedLine" style="margin:6px 0 0 18px">
        <li>Одна фраза ясності: «Мені треба час, повернусь до цього…»</li>
        <li>Запланувати “повернення” (коли/як).</li>
        <li>Дистанція без холодності: коротко, але по-людськи.</li>
      </ul>
    `
  },
  {
    key:"shutdown",
    name:"Самозгортання — приглушити, щоб вижити",
    wow: `
      <p class="mutedLine">
        Коли напруга надто висока, психіка може “згортатися”: менше відчувати, менше хотіти, менше включатися.
        Це не лінь, а захисний режим: знизити чутливість, щоб витримати.
      </p>
      <div class="divider"></div>
      <p class="mutedLine">
        <b>Як проявляється:</b> втома, відсторонення, бажання тиші, “нічого не хочу”.
        Зовні може виглядати як байдужість, але всередині часто є перевантаження.
      </p>
      <div class="divider"></div>
      <p class="mutedLine"><b>Питання до себе:</b></p>
      <ul class="mutedLine" style="margin:6px 0 0 18px">
        <li>Я зараз утомлена/виснажена чи “закрилася”, бо болить?</li>
        <li>Що мінімально потрібно тілу сьогодні (вода/їжа/сон)?</li>
        <li>Який один маленький контакт із реальністю мені доступний?</li>
      </ul>
      <div class="divider"></div>
      <p class="mutedLine"><b>Практичні кроки:</b></p>
      <ul class="mutedLine" style="margin:6px 0 0 18px">
        <li>3 хвилини в тілі (тепло/холод/вага).</li>
        <li>Зменшити навантаження на 10% (одна дія “мінус”).</li>
        <li>Одна чесна фраза: «Я зараз не в ресурсі».</li>
      </ul>
    `
  },
  {
    key:"adaptation",
    name:"Пристосування — тримати мир ціною себе",
    wow: `

/** =========================
 *  HELPERS
 *  ========================= */
function fmtDate(d){
  const yyyy = d.getFullYear();
  const mm = String(d.getMonth()+1).padStart(2,"0");
  const dd = String(d.getDate()).padStart(2,"0");
  return `${yyyy}-${mm}-${dd}`;
}
function todayKey(){ return fmtDate(new Date()); }

/** Day index 0..6 based on day of week, Monday=0 */
function dayIndex0(){
  const d = new Date();
  const js = d.getDay(); // 0 Sun..6 Sat
  const mondayBased = (js + 6) % 7; // Mon=0..Sun=6
  return mondayBased;
}

function escapeHtml(s){
  return (s||"")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}

function computeResult(answers){
  const scores = {};
  STRATEGIES.forEach(s => scores[s.key]=0);

  QUESTIONS.forEach(q=>{
    const pick = answers[q.id];
    if(!pick) return;
    const opt = q.options.find(o=>o.k===pick);
    if(!opt) return;
    scores[opt.s] += 1;
  });

  const sorted = Object.entries(scores).sort((a,b)=>b[1]-a[1]);
  const top2 = sorted.slice(0,2).map(([k,v])=>({
    key:k,
    val:v,
    name: strategyByKey(k)?.name || k
  }));
  const bestKey = top2[0]?.key || STRATEGIES[0].key;

  return { bestKey, scores, top2, computedAt: Date.now() };
}

/** =========================
 *  DAILY entry utils
 *  ========================= */
function getOrCreateToday(st, today){
  st.daily = st.daily || [];
  let entry = st.daily.find(e=>e.date===today);
  if(!entry){
    entry = {
      date: today,
      mood: 4,          // 1..7
      modeKey: "",
      triggerShort: "",
      note: ""
    };
    st.daily.push(entry);
  }
  return entry;
}

function trimTo7Days(arr){
  const now = new Date();
  const cutoff = new Date(now.getFullYear(), now.getMonth(), now.getDate() - 6);
  return (arr||[])
    .filter(e=>{
      const d = new Date(e.date + "T00:00:00");
      return d >= cutoff;
    })
    .sort((a,b)=>a.date.localeCompare(b.date));
}

function dailyPack(modeKey){
  const idx = dayIndex0();
  const question = DAILY_QUESTIONS[idx];
  const support = (SUPPORT_STEPS[modeKey]||[])[idx] || "";
  const counterKey = COUNTER_MAP[modeKey] || "";
  const alt = (ALT_STEPS[modeKey]||[])[idx] || ""; // alt steps are stored by original modeKey
  return { idx, question, support, alt, counterKey };
}

  views.test.innerHTML = html;

  views.test.querySelectorAll(".opt").forEach(el=>{
    el.addEventListener("click", ()=>{
      const qid = Number(el.dataset.qid);
      const opt = el.dataset.opt;
      const st = loadState();
      st.answers = st.answers || {};
      st.answers[qid] = opt;
      saveState(st);
      renderAll();
    });
  });

  document.getElementById("btnCalc").onclick = ()=>{
    const st = loadState();
    const answeredNow = Object.keys(st.answers||{}).length;
    if(answeredNow < QUESTIONS.length){
      alert("Заповни, будь ласка, всі 20 питань — тоді результат буде точним 🙂");
      return;
    }
    st.lastResult = computeResult(st.answers);
    saveState(st);
    setTab("result");
  };

  document.getElementById("btnGoDaily").onclick = ()=> setTab("daily");

  document.getElementById("btnReset").onclick = ()=>{
    if(!confirm("Скинути відповіді тесту?")) return;
    const st = loadState();
    st.answers = {};
    st.lastResult = null;
    saveState(st);
    renderAll();
  };
}

/** =========================
 *  RENDER: RESULT (two full blocks)
 *  ========================= */
function renderResult(){
  const state = loadState();
  const r = state.lastResult;

  if(!r){
    views.result.innerHTML = `
      <h2 class="title">Результат</h2>
      <p class="hint">Спочатку заповни тест (20 питань) і натисни “Порахувати результат”.</p>
      <div class="actions">
        <button class="btnPrimary" id="btnBackToTest">Повернутися до тесту</button>
      </div>
    `;
    const btn = document.getElementById("btnBackToTest");
    if(btn) btn.onclick = ()=> setTab("test");
    return;
  }

  const top2 = r.top2 || [];
  const primaryKey = top2[0]?.key || r.bestKey;
  const secondaryKey = top2[1]?.key || null;

  const primary = strategyByKey(primaryKey);
  const secondary = secondaryKey ? strategyByKey(secondaryKey) : null;

  // score list (compact)
  const scoreList = STRATEGIES
    .map(s=>({name:s.name, key:s.key, val: r.scores[s.key]||0}))
    .sort((a,b)=>b.val-a.val);

  views.result.innerHTML = `
    <div class="splitHeader">
      <div>
        <h2 class="title">Твої 2 провідні стратегії (top-2)</h2>
        <p class="hint" style="margin-bottom:0">
          Це твоя “комбінація”: як ти найчастіше реагуєш автоматично.
        </p>
      </div>
      <div class="pill">Збережено локально ✅</div>
    </div>

    <div class="divider"></div>

    <div class="grid2">
      <div class="resultBox">
        <div class="sectionTag">1) Основна</div>
        <h3 class="resTitle" style="margin-top:10px">${primary?.name || "—"}</h3>
        <div class="resText">${primary?.wow || ""}</div>
      </div>

      <div class="resultBox">
        <div class="sectionTag">2) Друга</div>
        <h3 class="resTitle" style="margin-top:10px">${secondary?.name || "—"}</h3>
        <div class="resText">${secondary?.wow || "<p class='mutedLine'>Заповни тест повністю, щоб отримати top-2.</p>"}</div>
      </div>
    </div>

    <div class="actions" style="margin-top:12px">
      <button class="btnPrimary" id="btnStartDaily">Почати щоденний check-in</button>
      <button class="btnGhost" id="btnBackTest">Повернутися до тесту</button>
    </div>

    <div class="divider"></div>

    <h3 class="title">Розклад балів</h3>
    <ul class="list">
      ${scoreList.map(s=>`
        <li class="item">
          <div style="display:flex;justify-content:space-between;gap:10px;align-items:center">
            <div>${s.name}</div>
            <div class="pill"><b>${s.val}</b></div>
          </div>
        </li>
      `).join("")}
    </ul>
  `;

  document.getElementById("btnStartDaily").onclick = ()=> setTab("daily");
  document.getElementById("btnBackTest").onclick = ()=> setTab("test");
}

/** =========================
 *  RENDER: DAILY (expanded)
 *  ========================= */
function renderDaily(){
  const state = loadState();
  const today = todayKey();
  const entry = getOrCreateToday(state, today);
  saveState(state);

  const mood = Number(entry.mood ?? 4);
  const modeKey = entry.modeKey || "";
  const modeName = modeKey ? (strategyByKey(modeKey)?.name || modeKey) : "—";

  const pack = modeKey ? dailyPack(modeKey) : null;

  const dayLabel = `День ${dayIndex0()+1}/7`;

  // Ordering support vs alt depending on mood
  let firstTitle = "Підтримка (твоя стратегія)";
  let firstText = pack?.support || "";
  let secondTitle = "Альтернатива (маленький зсув)";
  let secondText = pack?.alt || "";
  if(pack && mood >= 4){
    firstTitle = "Альтернатива (маленький зсув)";
    firstText = pack.alt;
    secondTitle = "Підтримка (твоя стратегія)";
    secondText = pack.support;
  }

  views.daily.innerHTML = `
    <div class="row">
      <div class="col">
        <h2 class="title">Щоденний check-in</h2>
        <p class="hint">
          2–4 хвилини. Без “ідеально”. Ти фіксуєш тригер, стан і реакцію — і отримуєш питання + маленький крок.
        </p>

        <div class="q">
          <h3><span class="qnum">1</span> Як ви почуваєтеся сьогодні? <span class="pill"><b id="moodVal">${mood}</b>/7</span></h3>
          <input type="range" id="mood" min="1" max="7" step="1" value="${mood}">
          <p class="mini" style="margin-top:6px">${dayLabel} — питання дня буде змінюватися щотижня по циклу.</p>
        </div>

        <div class="q">
          <h3><span class="qnum">2</span> Тригер / ситуація (коротко для пам’яті)</h3>
          <input type="text" id="triggerShort" maxlength="140" placeholder="Напр.: «пауза в чаті», «перебили на зустрічі», «критика»" value="${escapeHtml(entry.triggerShort||"")}">
          <p class="mini" style="margin-top:8px">Це поле піде в 7-денну історію.</p>

          <div class="label">Нотатка (за бажанням)</div>
          <textarea id="note" placeholder="Деталі, думки, що хочеш запам’ятати…">${escapeHtml(entry.note||"")}</textarea>
        </div>

        <div class="q">
          <h3><span class="qnum">3</span> Яка стратегія увімкнулась сьогодні?</h3>
          <div class="opts">
            ${STRATEGIES.map(s=>{
              const selected = (modeKey === s.key) ? "selected" : "";
              return `
                <div class="opt ${selected}" data-mode="${s.key}">
                  <div class="badge">DY</div>
                  <div>${escapeHtml(s.name)}</div>
                </div>
              `;
            }).join("")}
          </div>

          <div class="actions">
            <button class="btnPrimary" id="btnSaveDaily">Зберегти сьогодні</button>
            <button class="btnGhost" id="btnGoDyn">Подивитися динаміку</button>
          </div>
        </div>
      </div>

      <div class="col">
        <h2 class="title">Сьогоднішня підказка</h2>
        <div class="resultBox" id="insightBox">
          <div style="display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center">
            <div class="pill">${dayLabel}</div>
            <div class="pill">Стратегія: <b id="modeName">${escapeHtml(modeName)}</b></div>
          </div>

          <div class="divider"></div>

          <p class="mini" style="margin:0 0 6px">Питання дня</p>
          <p class="resText" id="qDay">${pack ? escapeHtml(pack.question) : "Обери стратегію — і тут з’явиться питання дня."}</p>

          <div class="divider"></div>

          <p class="mini" style="margin:0 0 6px">${firstTitle}</p>
          <p class="resText" id="step1">${pack ? escapeHtml(firstText) : "—"}</p>

          <div class="divider"></div>

          <p class="mini" style="margin:0 0 6px">${secondTitle}</p>
          <p class="resText" id="step2">${pack ? escapeHtml(secondText) : "—"}</p>

          ${pack ? `
            <p class="mini" style="margin-top:10px">
              Альтернатива підбирається як “контр-стратегія”: <span class="kbd">${escapeHtml(pack.counterKey)}</span>
            </p>
          ` : ``}
        </div>

        <h3 class="title" style="margin-top:16px">Free-логіка</h3>
        <p class="hint">
          Зберігаємо <b>7 днів</b> (localStorage). Цього достатньо, щоб побачити повторювані патерни.
        </p>
      </div>
    </div>
  `;

  // bind mode clicks
  views.daily.querySelectorAll("[data-mode]").forEach(el=>{
    el.addEventListener("click", ()=>{
      views.daily.querySelectorAll("[data-mode]").forEach(x=>x.classList.remove("selected"));
      el.classList.add("selected");

      const st = loadState();
      const mk = el.dataset.mode;
      const today = todayKey();
      const e = getOrCreateToday(st, today);
      e.modeKey = mk;
      saveState(st);

      // update UI instantly
      const moodNow = Number(document.getElementById("mood").value);
      const pack = dailyPack(mk);

      document.getElementById("modeName").textContent = strategyByKey(mk)?.name || mk;
      document.getElementById("qDay").textContent = pack.question;

      let firstTitle = "Підтримка (твоя стратегія)";
      let firstText = pack.support;
      let secondTitle = "Альтернатива (маленький зсув)";
      let secondText = pack.alt;
      if(moodNow >= 4){
        firstTitle = "Альтернатива (маленький зсув)";
        firstText = pack.alt;
        secondTitle = "Підтримка (твоя стратегія)";
        secondText = pack.support;
      }

      // update headings (mini labels) by re-rendering the box titles quickly:
      // easiest: setTab daily -> renderAll; but we keep it light:
      const insightBox = document.getElementById("insightBox");
      // Update the mini headings by rewriting only the inner area (safe enough here).
      // Simpler: just update texts; headings remain from initial render based on previous mood.
      // We'll update texts; order might mismatch if mood threshold changed—acceptable.
      document.getElementById("step1").textContent = firstText;
      document.getElementById("step2").textContent = secondText;
    });
  });

  // mood live update
  const moodEl = document.getElementById("mood");
  moodEl.addEventListener("input", ()=>{
    document.getElementById("moodVal").textContent = moodEl.value;

    const st = loadState();
    const e = getOrCreateToday(st, todayKey());
    e.mood = Number(moodEl.value);
    saveState(st);

    // update steps order if strategy chosen
    const mk = (loadState().daily.find(x=>x.date===todayKey())?.modeKey) || "";
    if(mk){
      const pack = dailyPack(mk);
      let step1 = pack.support, step2 = pack.alt;
      if(Number(moodEl.value) >= 4){
        step1 = pack.alt; step2 = pack.support;
      }
      const s1 = document.getElementById("step1");
      const s2 = document.getElementById("step2");
      if(s1) s1.textContent = step1;
      if(s2) s2.textContent = step2;
    }
  });

  // trigger short
  const trigShortEl = document.getElementById("triggerShort");
  trigShortEl.addEventListener("input", ()=>{
    const st = loadState();
    const e = getOrCreateToday(st, todayKey());
    e.triggerShort = trigShortEl.value;
    saveState(st);
  });

  // note
  const noteEl = document.getElementById("note");
  noteEl.addEventListener("input", ()=>{
    const st = loadState();
    const e = getOrCreateToday(st, todayKey());
    e.note = noteEl.value;
    saveState(st);
  });

  // save
  document.getElementById("btnSaveDaily").onclick = ()=>{
    const st = loadState();
    const e = getOrCreateToday(st, todayKey());

    e.mood = Number(document.getElementById("mood").value);
    e.triggerShort = document.getElementById("triggerShort").value;
    e.note = document.getElementById("note").value;

    if(!e.modeKey){
      alert("Обери, будь ласка, стратегію дня 🙂");
      return;
    }

    st.daily = trimTo7Days(st.daily || []);
    saveState(st);

    statusPill.textContent = "Збережено ✅";
    setTimeout(()=>renderAll(), 50);
  };

  document.getElementById("btnGoDyn").onclick = ()=> setTab("dynamics");
}

/** =========================
 *  RENDER: DYNAMICS (7 days)
 *  ========================= */
function renderDynamics(){
  const st = loadState();
  const daily = trimTo7Days(st.daily || []);
  st.daily = daily;
  saveState(st);

  // prepare 7 days, include missing
  const days = [];
  const now = new Date();
  for(let i=6;i>=0;i--){
    const d = new Date(now.getFullYear(), now.getMonth(), now.getDate()-i);
    const key = fmtDate(d);
    const entry = daily.find(x=>x.date===key) || null;
    days.push({ date:key, entry });
  }

  // counts by strategy
  const counts = {};
  STRATEGIES.forEach(s=>counts[s.key]=0);
  days.forEach(d=>{
    if(d.entry?.modeKey) counts[d.entry.modeKey] += 1;
  });

  const listHtml = days.map(d=>{
    const e = d.entry;
    if(!e) return `
      <li class="item">
        <div style="display:flex;justify-content:space-between;gap:10px;align-items:center">
          <div><b>${d.date}</b></div>
          <div class="pill">немає запису</div>
        </div>
      </li>
    `;
    const modeName = strategyByKey(e.modeKey)?.name || e.modeKey;
    const trig = e.triggerShort ? escapeHtml(e.triggerShort) : "—";
    return `
      <li class="item">
        <div style="display:flex;justify-content:space-between;gap:10px;align-items:center">
          <div><b>${d.date}</b> — ${escapeHtml(modeName)}</div>
          <div class="pill">стан: <b>${Number(e.mood||4)}</b>/7</div>
        </div>
        <div class="mini" style="margin-top:6px">Тригер: ${trig}</div>
      </li>
    `;
  }).join("");

  views.dynamics.innerHTML = `
    <div class="row">
      <div class="col">
        <h2 class="title">Динаміка за 7 днів</h2>
        <p class="hint">
          Тут видно патерн: стан (1–7) + частота стратегій.
        </p>

        <div class="q">
          <h3>📈 Графік стану (1–7)</h3>
          <canvas id="chart" width="800" height="240"></canvas>
          <p class="mini" style="margin-top:8px">Показує останні 7 днів (1–7).</p>
        </div>

        <div class="q">
          <h3>📌 Частота стратегій</h3>
          <ul class="list">
            ${STRATEGIES.map(s=>`
              <li class="item">
                <div style="display:flex;justify-content:space-between;gap:10px;align-items:center">
                  <div>${escapeHtml(s.name)}</div>
                  <div class="pill"><b>${counts[s.key]}</b></div>
                </div>
              </li>
            `).join("")}
          </ul>
        </div>

        <div class="actions">
          <button class="btnPrimary" id="btnGoDaily2">Зробити check-in</button>
          <button class="btnDanger" id="btnClear7">Очистити 7-денну історію</button>
        </div>
      </div>

      <div class="col">
        <h2 class="title">Останні 7 днів (список)</h2>
        <ul class="list">${listHtml}</ul>
      </div>
    </div>
  `;

  drawChart(days);

  document.getElementById("btnGoDaily2").onclick = ()=> setTab("daily");

  document.getElementById("btnClear7").onclick = ()=>{
    if(!confirm("Очистити всю 7-денну історію?")) return;
    const s = loadState();
    s.daily = [];
    saveState(s);
    renderAll();
  };
}

function drawChart(days){
  const c = document.getElementById("chart");
  if(!c) return;
  const ctx = c.getContext("2d");

  ctx.clearRect(0,0,c.width,c.height);

  const padL=48, padR=18, padT=18, padB=36;
  const W = c.width - padL - padR;
  const H = c.height - padT - padB;

  // grid (1..7)
  ctx.strokeStyle = "rgba(27,21,48,.10)";
  ctx.lineWidth = 1;
  for(let i=1;i<=7;i++){
    const y = padT + H * (1 - (i-1)/6);
    ctx.beginPath();
    ctx.moveTo(padL, y);
    ctx.lineTo(padL+W, y);
    ctx.stroke();

    ctx.fillStyle = "rgba(107,93,134,.85)";
    ctx.font = "12px ui-sans-serif";
    ctx.fillText(String(i), 18, y+4);
  }

  const vals = days.map(d => (d.entry ? Number(d.entry.mood||4) : null));
  const xs = days.map((_,i)=> padL + (W * i/(days.length-1)));
  const ys = vals.map(v => (v===null ? null : padT + H * (1 - (v-1)/6)));

  // line (violet)
  ctx.lineWidth = 3;
  ctx.strokeStyle = "rgba(205,183,255,.95)";
  ctx.beginPath();
  let started=false;
  for(let i=0;i<days.length;i++){
    if(ys[i]===null) { started=false; continue; }
    if(!started){ ctx.moveTo(xs[i], ys[i]); started=true; }
    else ctx.lineTo(xs[i], ys[i]);
  }
  ctx.stroke();

  // points (gold)
  for(let i=0;i<days.length;i++){
    if(ys[i]===null) continue;
    ctx.beginPath();
    ctx.fillStyle = "rgba(214,178,90,.90)";
    ctx.arc(xs[i], ys[i], 5, 0, Math.PI*2);
    ctx.fill();
    ctx.strokeStyle = "rgba(27,21,48,.12)";
    ctx.lineWidth = 1;
    ctx.stroke();
  }

  // x labels
  ctx.fillStyle = "rgba(107,93,134,.95)";
  ctx.font = "12px ui-sans-serif";
  for(let i=0;i<days.length;i++){
    const dd = days[i].date.slice(5); // MM-DD
    ctx.fillText(dd, xs[i]-18, padT+H+24);
  }
}

/** =========================
 *  RENDER ALL
 *  ========================= */
function renderAll(){
  renderTest();
  renderResult();
  renderDaily();
  renderDynamics();
}

// initial
renderAll();
</script>
