}

    .opt.selected{

</head>

<br><b>Ризик:</b> надвкладення й залежність від реакції.

function fmtDate(d){
  const yyyy = d.getFullYear();
  const mm = String(d.getMonth()+1).padStart(2,"0");
  const dd = String(d.getDate()).padStart(2,"0");
  return `${yyyy}-${mm}-${dd}`;
}
function todayKey(){ return fmtDate(new Date()); }

function strategyByKey(k){ return STRATEGIES.find(s=>s.key===k); }

function computeResult(answers){
  // scores per strategy
  const scores = {};
  STRATEGIES.forEach(s => scores[s.key]=0);

  // count each selected option as +1 for mapped strategy
  QUESTIONS.forEach(q=>{
    const pick = answers[q.id];
    if(!pick) return;
    const opt = q.options.find(o=>o.k===pick);
    if(!opt) return;
    scores[opt.s] += 1;
  });

  // choose top strategy
  let bestKey = STRATEGIES[0].key;
  let bestVal = -1;
  for(const [k,v] of Object.entries(scores)){
    if(v>bestVal){ bestVal=v; bestKey=k; }
  }

  // If tie, keep first by strategy order
  const best = strategyByKey(bestKey);

  // Secondary: top2
  const sorted = Object.entries(scores).sort((a,b)=>b[1]-a[1]);
  const top2 = sorted.slice(0,2).map(([k,v])=>({key:k, val:v, name:strategyByKey(k).name}));

  return { bestKey, scores, top2, computedAt: Date.now() };
}

                <div>${o.t}</div>
              </div>
            `;
          }).join("")}
        </div>
      </div>
    `;
  });

  views.test.innerHTML = html;

  // bind option clicks
  views.test.querySelectorAll(".opt").forEach(el=>{
    el.addEventListener("click", ()=>{
      const qid = Number(el.dataset.qid);
      const opt = el.dataset.opt;
      const st = loadState();
      st.answers = st.answers || {};
      st.answers[qid] = opt;
      saveState(st);
      renderAll();
    });
  });

  // buttons
  document.getElementById("btnCalc").onclick = ()=>{
    const st = loadState();
    const answeredNow = Object.keys(st.answers||{}).length;
    if(answeredNow < QUESTIONS.length){
      alert("Заповни, будь ласка, всі 20 питань — тоді результат буде точним 🙂");
      return;
    }
    st.lastResult = computeResult(st.answers);
    saveState(st);
    setTab("result");
  };

  document.getElementById("btnGoDaily").onclick = ()=> setTab("daily");

  document.getElementById("btnReset").onclick = ()=>{
    if(!confirm("Скинути відповіді тесту?")) return;
    const st = loadState();
    st.answers = {};
    st.lastResult = null;
    saveState(st);
    renderAll();
  };
}

/** =========================
 *  RENDER: RESULT
 *  ========================= */
function renderResult(){
  const state = loadState();
  const r = state.lastResult;

  if(!r){
    views.result.innerHTML = `
      <h2 class="title">Результат</h2>
      <p class="hint">Спочатку заповни тест (20 питань) і натисни “Порахувати результат”.</p>
      <div class="actions">
        <button class="btnPrimary" onclick="(${setTab.toString()})('test')">Повернутися до тесту</button>
      </div>
    `;
    return;
  }

  const best = strategyByKey(r.bestKey);
  const top2 = r.top2 || [];

  // score list (compact)
  const scoreList = STRATEGIES
    .map(s=>({name:s.name, key:s.key, val: r.scores[s.key]||0}))
    .sort((a,b)=>b.val-a.val);

  views.result.innerHTML = `
    <div class="row">
      <div class="col">
        <h2 class="title">Твоя базова стратегія</h2>
        <div class="resultBox">
          <h3 class="resTitle">${best.name}</h3>
          <p class="resText">${best.wow}</p>
        </div>

        <div class="actions" style="margin-top:12px">
          <button class="btnPrimary" id="btnStartDaily">Почати щоденний check-in</button>
          <button class="btnGhost" id="btnBackTest">Повернутися до тесту</button>
        </div>

        <p class="mini" style="margin-top:10px">
          P.S. Твій результат збережено локально на цьому пристрої (localStorage).
        </p>
      </div>

      <div class="col">
        <h2 class="title">Профіль (top-2)</h2>
        <p class="hint">Іноді ми маємо 1 головну стратегію + 1 “другу”, яка вмикається під стресом.</p>
        <div class="grid2">
          ${top2.map(x=>`
            <div class="resultBox">
              <div class="pill">Балів: <b>${x.val}</b></div>
              <h3 class="resTitle" style="margin-top:8px">${x.name}</h3>
              <p class="mini" style="margin:0">Ключ: <span class="kbd">${x.key}</span></p>
            </div>
          `).join("")}
        </div>

        <h3 class="title" style="margin-top:16px">Розклад балів</h3>
        <ul class="list">
          ${scoreList.map(s=>`
            <li class="item">
              <div style="display:flex;justify-content:space-between;gap:10px">
                <div>${s.name}</div>
                <div class="pill"><b>${s.val}</b></div>
              </div>
            </li>
          `).join("")}
        </ul>
      </div>
    </div>
  `;

  document.getElementById("btnStartDaily").onclick = ()=> setTab("daily");
  document.getElementById("btnBackTest").onclick = ()=> setTab("test");
}

/** =========================
 *  RENDER: DAILY
 *  ========================= */
function renderDaily(){
  const state = loadState();
  const today = todayKey();
  const existing = (state.daily||[]).find(e=>e.date===today);

  const modeKey = existing?.modeKey || "";
  const stress = existing?.stress ?? 5;
  const trigger = existing?.trigger || "";

  const modeName = modeKey ? (strategyByKey(modeKey)?.name || modeKey) : "—";

  views.daily.innerHTML = `
    <div class="row">
      <div class="col">
        <h2 class="title">Щоденний check-in</h2>
        <p class="hint">
          3 кроки. Без аналізу. Просто фіксація.
          Це створює динаміку і повернення в додаток.
        </p>

        <div class="q">
          <h3>1️⃣ Сьогодні я більше була в режимі:</h3>
          <div class="opts">
            ${DAILY_MODES.map(m=>{
              const selected = (modeKey === m.key) ? "selected" : "";
              return `
                <div class="opt ${selected}" data-mode="${m.key}">
                  <div class="badge">DY</div>
                  <div>${m.label}</div>
                </div>
              `;
            }).join("")}
          </div>

          <div class="label">2️⃣ Рівень внутрішньої напруги: <span class="pill"><b id="stressVal">${stress}</b>/10</span></div>
          <input type="range" id="stress" min="0" max="10" step="1" value="${stress}">

          <div class="label">3️⃣ Тригер (коротко, для себе)</div>
          <input type="text" id="trigger" maxlength="120" placeholder="Напр.: «перебили на зустрічі» / «пауза в чаті»" value="${escapeHtml(trigger)}">
          <p class="mini" style="margin-top:8px">Збережеться в історії на 7 днів.</p>

          <div class="actions">
            <button class="btnPrimary" id="btnSaveDaily">Зберегти сьогодні</button>
            <button class="btnGhost" id="btnGoDyn">Подивитися динаміку</button>
          </div>
        </div>
      </div>

      <div class="col">
        <h2 class="title">Мікро-інсайт</h2>
        <div class="resultBox" id="insightBox">
          <p class="mini" style="margin:0 0 6px">Сьогоднішній режим:</p>
          <h3 class="resTitle" style="margin-top:0">${modeName}</h3>
          <p class="resText" id="insightText">${modeKey ? dailyInsight(modeKey, stress) : "Обери режим і напругу — і я покажу короткий інсайт."}</p>
        </div>

        <h3 class="title" style="margin-top:16px">Нагадування (free-логіка)</h3>
        <p class="hint">
          У free ми зберігаємо <b>7 днів</b>. Це вже достатньо, щоб побачити патерн.
          Далі (пізніше) можна буде додати 30 днів як premium.
        </p>
      </div>
    </div>
  `;

  // bind mode clicks
  views.daily.querySelectorAll("[data-mode]").forEach(el=>{
    el.addEventListener("click", ()=>{
      views.daily.querySelectorAll("[data-mode]").forEach(x=>x.classList.remove("selected"));
      el.classList.add("selected");

      const st = loadState();
      const mk = el.dataset.mode;
      const entry = getOrCreateToday(st, today);
      entry.modeKey = mk;
      saveState(st);

      // update insight
      const stressV = Number(document.getElementById("stress").value);
      document.getElementById("insightText").textContent = dailyInsight(mk, stressV);
      const modeName = strategyByKey(mk)?.name || mk;
      document.querySelector("#insightBox .resTitle").textContent = modeName;
    });
  });

  // stress live update
  const stressEl = document.getElementById("stress");
  stressEl.addEventListener("input", ()=>{
    document.getElementById("stressVal").textContent = stressEl.value;
    const st = loadState();
    const entry = getOrCreateToday(st, today);
    entry.stress = Number(stressEl.value);
    saveState(st);

    const mk = (loadState().daily.find(e=>e.date===today)?.modeKey) || "";
    if(mk) document.getElementById("insightText").textContent = dailyInsight(mk, stressEl.value);
  });

  // trigger
  const trigEl = document.getElementById("trigger");
  trigEl.addEventListener("input", ()=>{
    const st = loadState();
    const entry = getOrCreateToday(st, today);
    entry.trigger = trigEl.value;
    saveState(st);
  });

  // save
  document.getElementById("btnSaveDaily").onclick = ()=>{
    const st = loadState();
    const entry = getOrCreateToday(st, today);
    // make sure fields saved
    entry.stress = Number(document.getElementById("stress").value);
    entry.trigger = document.getElementById("trigger").value;

    // validate
    if(!entry.modeKey){
      alert("Обери, будь ласка, режим дня 🙂");
      return;
    }

    // keep only last 7 days
    st.daily = trimTo7Days(st.daily || []);
    saveState(st);

    statusPill.textContent = "Збережено ✅";
    setTimeout(()=>renderAll(), 50);
  };

  document.getElementById("btnGoDyn").onclick = ()=> setTab("dynamics");
}

function getOrCreateToday(st, today){
  st.daily = st.daily || [];
  let entry = st.daily.find(e=>e.date===today);
  if(!entry){
    entry = { date: today, modeKey:"", stress:5, trigger:"" };
    st.daily.push(entry);
  }
  return entry;
}

function trimTo7Days(arr){
  // keep entries within last 7 days inclusive
  const now = new Date();
  const cutoff = new Date(now.getFullYear(), now.getMonth(), now.getDate() - 6);
  return arr
    .filter(e=>{
      const d = new Date(e.date + "T00:00:00");
      return d >= cutoff;
    })
    .sort((a,b)=>a.date.localeCompare(b.date));
}

/** =========================
 *  RENDER: DYNAMICS (7 days)
 *  ========================= */
function renderDynamics(){
  const st = loadState();
  const daily = trimTo7Days(st.daily || []);
  // ensure state trimmed
  st.daily = daily;
  saveState(st);

  // Prepare 7-day array including missing days
  const days = [];
  const now = new Date();
  for(let i=6;i>=0;i--){
    const d = new Date(now.getFullYear(), now.getMonth(), now.getDate()-i);
    const key = fmtDate(d);
    const entry = daily.find(x=>x.date===key) || null;
    days.push({ date:key, entry });
  }

  // counts by mode
  const counts = {};
  DAILY_MODES.forEach(m=>counts[m.key]=0);
  days.forEach(d=>{
    if(d.entry?.modeKey) counts[d.entry.modeKey] += 1;
  });

  const listHtml = days.map(d=>{
    const e = d.entry;
    if(!e) return `
      <li class="item">
        <div style="display:flex;justify-content:space-between;gap:10px">
          <div><b>${d.date}</b></div>
          <div class="pill">немає запису</div>
        </div>
      </li>
    `;
    const modeName = strategyByKey(e.modeKey)?.name || e.modeKey;
    return `
      <li class="item">
        <div style="display:flex;justify-content:space-between;gap:10px">
          <div><b>${d.date}</b> — ${modeName}</div>
          <div class="pill">напруга: <b>${e.stress}</b>/10</div>
        </div>
        ${e.trigger ? `<div class="mini" style="margin-top:6px">Тригер: ${escapeHtml(e.trigger)}</div>` : `<div class="mini" style="margin-top:6px">Тригер: —</div>`}
      </li>
    `;
  }).join("");

  views.dynamics.innerHTML = `
    <div class="row">
      <div class="col">
        <h2 class="title">Динаміка за 7 днів</h2>
        <p class="hint">
          Тут “магія”: ти бачиш патерн. Це створює щоденне повернення.
        </p>

        <div class="q">
          <h3>📈 Графік напруги</h3>
          <canvas id="chart" width="800" height="240"></canvas>
          <p class="mini" style="margin-top:8px">Показує останні 7 днів (0–10).</p>
        </div>

        <div class="q">
          <h3>📌 Частота режимів</h3>
          <ul class="list" id="modeCounts">
            ${DAILY_MODES.map(m=>`
              <li class="item">
                <div style="display:flex;justify-content:space-between;gap:10px">
                  <div>${m.label}</div>
                  <div class="pill"><b>${counts[m.key]}</b></div>
                </div>
              </li>
            `).join("")}
          </ul>
        </div>

        <div class="actions">
          <button class="btnPrimary" id="btnGoDaily2">Зробити check-in</button>
          <button class="btnDanger" id="btnClear7">Очистити 7-денну історію</button>
        </div>
      </div>

      <div class="col">
        <h2 class="title">Останні 7 днів (список)</h2>
        <ul class="list">${listHtml}</ul>
      </div>
    </div>
  `;

  // draw chart
  drawChart(days);

  document.getElementById("btnGoDaily2").onclick = ()=> setTab("daily");

  document.getElementById("btnClear7").onclick = ()=>{
    if(!confirm("Очистити всю 7-денну історію?")) return;
    const s = loadState();
    s.daily = [];
    saveState(s);
    renderAll();
  };
}

function drawChart(days){
  const c = document.getElementById("chart");
  if(!c) return;
  const ctx = c.getContext("2d");

  // clear
  ctx.clearRect(0,0,c.width,c.height);

  // padding
  const padL=48, padR=18, padT=18, padB=36;
  const W = c.width - padL - padR;
  const H = c.height - padT - padB;

  // background grid
  ctx.globalAlpha = 1;
  ctx.strokeStyle = "rgba(27,21,48,.10)";
  ctx.lineWidth = 1;

  for(let i=0;i<=10;i+=2){
    const y = padT + H * (1 - i/10);
    ctx.beginPath();
    ctx.moveTo(padL, y);
    ctx.lineTo(padL+W, y);
    ctx.stroke();

    ctx.fillStyle = "rgba(107,93,134,.85)";
    ctx.font = "12px ui-sans-serif";
    ctx.fillText(String(i), 14, y+4);
  }

  // points
  const vals = days.map(d => (d.entry ? Number(d.entry.stress) : null));
  const xs = days.map((_,i)=> padL + (W * i/(days.length-1)));
  const ys = vals.map(v => (v===null ? null : padT + H * (1 - v/10)));

  // line
  ctx.lineWidth = 3;
  ctx.strokeStyle = "rgba(205,183,255,.95)"; // violet line
  ctx.beginPath();
  let started=false;
  for(let i=0;i<days.length;i++){
    if(ys[i]===null) { started=false; continue; }
    if(!started){ ctx.moveTo(xs[i], ys[i]); started=true; }
    else ctx.lineTo(xs[i], ys[i]);
  }
  ctx.stroke();

  // points dots (gold)
  for(let i=0;i<days.length;i++){
    if(ys[i]===null) continue;
    ctx.beginPath();
    ctx.fillStyle = "rgba(214,178,90,.90)";
    ctx.arc(xs[i], ys[i], 5, 0, Math.PI*2);
    ctx.fill();
    ctx.strokeStyle = "rgba(27,21,48,.12)";
    ctx.lineWidth = 1;
    ctx.stroke();
  }

  // x labels
  ctx.fillStyle = "rgba(107,93,134,.95)";
  ctx.font = "12px ui-sans-serif";
  for(let i=0;i<days.length;i++){
    const dd = days[i].date.slice(5); // MM-DD
    ctx.fillText(dd, xs[i]-18, padT+H+24);
  }
}

/** =========================
 *  RENDER ALL
 *  ========================= */
function renderAll(){
  renderTest();
  renderResult();
  renderDaily();
  renderDynamics();
}

/** =========================
 *  UTIL: HTML escape
 *  ========================= */
function escapeHtml(s){
  return (s||"")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}

// initial
renderAll();
</script>
