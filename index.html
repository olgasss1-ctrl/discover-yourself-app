<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Discover Yourself</title>
<style>
  body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial;background:#f6f7fb;color:#0f172a}
  .wrap{max-width:1000px;margin:0 auto;padding:40px}
  h1{font-size:52px;margin:0 0 24px}
  .card{background:#fff;border-radius:20px;padding:28px;box-shadow:0 10px 30px rgba(0,0,0,.06)}
  .top{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
  .pill{background:#eaf2ff;border-radius:999px;padding:10px 14px;font-weight:700}
  .hint{color:#64748b;margin:10px 0 16px;font-weight:600}
  button{width:100%;text-align:left;padding:14px;border-radius:12px;border:1px solid #e5e7eb;background:#f1f5f9;cursor:pointer;font-size:16px;line-height:1.25}
  button:hover{background:#e2e8f0}
  .cta{background:#0b1220;color:#fff;border:0;margin-top:18px;text-align:center;font-weight:800}
</style>
<link rel="manifest" href="/manifest.webmanifest">
  <meta name="theme-color" content="#0b1220">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="apple-touch-icon" href="/icon-192.png">
</head>
<body>
<div class="wrap">
  <h1>Discover Yourself</h1>
  <div class="card">
    <div class="top">
      <div class="pill" id="status">Готово ✅</div>
      <div class="pill" id="counter">Питання: —</div>
    </div>
    <div id="app"></div>
  </div>
</div>

<script>
async function main(){
  const res = await fetch("data.json",{cache:"no-store"});
  const data = await res.json();

  let scores = {};
  Object.keys(data.strategies).forEach(k=>scores[k]=0);

  let i=0;
  const total = data.questions.length;

  function updateCounter(){
    document.getElementById("counter").textContent = `Питання: ${Math.min(i+1,total)} / ${total}`;
  }

  function topTwo(){
    return Object.entries(scores).sort((a,b)=>b[1]-a[1]).slice(0,2).map(e=>e[0]);
  }

  function renderQ(){
    updateCounter();
    const q = data.questions[i];
    let html = `
      <div style="font-size:28px;font-weight:900;margin:0 0 8px;">${q.text}</div>
      <div class="hint">Обери один варіант — той, який найближче до твоєї реальної реакції.</div>
    `;
    q.options.forEach(o=>{
      html += `<p style="margin:0 0 12px;"><button onclick='pick(${JSON.stringify(o.tags)})'>${o.text}</button></p>`;
    });
    document.getElementById("app").innerHTML = html;
  }

  window.pick = function(tags){
    Object.entries(tags).forEach(([k,v])=>scores[k]+=v);
    i++;
    if(i>=total){
      renderResult();
    }else{
      renderQ();
    }
  }

  function renderResult(){
    document.getElementById("counter").textContent = `Питання: ${total} / ${total}`;

    const [a,b] = topTwo();
    const text1 = data.strategies[a];
    const text2 = data.strategies[b];

    document.getElementById("app").innerHTML = `
      <div style="font-size:32px;font-weight:900;margin:0 0 10px;">Твій внутрішній код</div>

      <p style="font-size:18px;line-height:1.65;margin:0 0 14px;">
        Схоже, у напрузі твоя психіка поєднує <b>${text1}</b> та <b>${text2}</b>.
        Це спосіб повернути собі контроль і відчуття безпеки.
      </p>

      <p style="font-size:18px;line-height:1.65;margin:0 0 14px;">
        У такі моменти ти можеш автоматично брати відповідальність на себе,
        намагатися щось виправити або швидко відновити контакт, щоб знову відчути стабільність.
      </p>

      <p style="font-size:18px;line-height:1.65;margin:0 0 14px;">
        Це дає відчуття керованості, але поступово забирає м’якість до себе і внутрішню опору.
      </p>

      <p style="font-size:18px;line-height:1.65;margin:0 0 16px;">
        Твій напрям розвитку — навчитися залишатися в контакті без автоматичного самозвинувачення
        та без потреби доводити свою цінність.
      </p>

      <button class="cta" onclick="alert('Premium скоро: глибша персоналізація + Точка опори + практика')">
        Перейти в глибину (Premium)
      </button>
    `;
  }

  renderQ();
}
main();
</script>
<script>
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
     navigator.serviceWorker.register("sw.js")
    });
  }
</script>
</body>
</html>
